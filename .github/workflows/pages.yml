# Publish the already-built HTML. There is no site generator in this job.
# The pages under index.html and weeks/ are committed on main.
#
# Creating a Pages site the first time needs a token with pages:write and
# administration:write. The default GITHUB_TOKEN can deploy after Pages exists,
# and configure-pages is asked to enable the site, but GitHub does not let
# GITHUB_TOKEN create it. If this job fails with a Pages permission error,
# turn the site on once:
#   Settings → Pages → Build and deployment → Source → GitHub Actions
# or "Deploy from a branch", branch main, folder / (root).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html favicon.svg .nojekyll _site/
          cp -a css js img weeks _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Publish the already-built HTML. There is no site generator in this job.
# Every root-level HTML page and the weeks/ pages are committed on main.
#
# Creating a Pages site the first time needs a token with pages:write and
# administration:write. The default GITHUB_TOKEN can deploy after Pages exists,
# and configure-pages is asked to enable the site, but GitHub does not let
# GITHUB_TOKEN create it. If this job fails with a Pages permission error,
# turn the site on once:
#   Settings → Pages → Build and deployment → Source → GitHub Actions
# or "Deploy from a branch", branch main, folder / (root).

name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      # Whichever deploy attempt succeeded. A failed attempt leaves page_url empty.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp *.html favicon.svg .nojekyll _site/
          cp -a css js img weeks _site/

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # Artifacts stay on the run, so a re-run that uploads another
          # "github-pages" artifact makes deploy-pages reject the run.
          name: github-pages-${{ github.run_attempt }}

      # deploy-pages can fail a few seconds after a successful upload with
      # "Found 0 artifact(s)" / no artifact named github-pages-<attempt>,
      # while artifact metadata is still propagating. Retry the same artifact.
      # The last attempt has no continue-on-error, so the job fails if every
      # attempt fails. Check outcome, not conclusion: continue-on-error turns
      # a failed attempt's conclusion into success.
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        if: steps.pages.outcome == 'success' && steps.deployment.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.pages.outcome == 'success' && steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata again
        if: steps.pages.outcome == 'success' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (final retry)
        id: deployment_final
        if: steps.pages.outcome == 'success' && steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Pages still needs to be turned on
        if: steps.pages.outcome != 'success'
        run: |
          echo "GitHub refused to create the Pages site with this token."
          echo "Turn it on once: Settings → Pages → Deploy from a branch → main → / (root)."
          echo "Or set the source to GitHub Actions and re-run this workflow."
          echo "The HTML is already on main. The public URL will be https://btzona.github.io/btzone/"
